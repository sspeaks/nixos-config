name: Host Build Cache

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-build-cache
  cancel-in-progress: false

# Cache writers can publish systems activated as root. Expose CACHIX_AUTH_TOKEN
# only to each job's final publish step, never to builds or job-level env.
# Configure Cachix read-only and do not add steps after publication.
#
# Cache project paths here; targets fetch upstream dependencies from
# cache.nixos.org with signature verification rather than mirroring nixpkgs.

jobs:
  build-x86-linux:
    name: Build x86_64 Linux closures
    runs-on: ubuntu-latest
    env:
      CACHIX_CACHE_NAME: sspeaks-nix
      CACHIX_PUBLIC_KEY: sspeaks-nix.cachix.org-1:Umjs3o8MgvHklkotM8S4XBfTz+zEQCnyr8TFpIC9x+o=
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          use-flakehub: disabled
          use-gha-cache: enabled

      - name: Configure Cachix (read-only substituter)
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ env.CACHIX_CACHE_NAME }}
          skipPush: true

      - name: Build host closures (no activation, no credential)
        run: |
          set -euo pipefail
          : > closures.txt
          paths='{}'
          for host in vidbox; do
            path="$(nix build --show-trace --print-build-logs --accept-flake-config \
              --no-link --print-out-paths \
              ".#nixosConfigurations.$host.config.system.build.toplevel")"
            printf '%s\n' "$path" >> closures.txt
            paths="$(jq --arg h "$host" --arg p "$path" '.[$h] = $p' <<< "$paths")"
          done
          cat closures.txt
          jq -n --arg sha "$GITHUB_SHA" --argjson paths "$paths" \
            '{"headSha": $sha, "paths": $paths}' > host-paths-x86.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: host-paths-x86
          path: host-paths-x86.json
          retention-days: 90

      - name: Publish to Cachix
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          test -s closures.txt

          xargs -a closures.txt cachix push "$CACHIX_CACHE_NAME"


  build-nixpi:
    name: Build nixpi closures
    runs-on: ubuntu-24.04-arm
    env:
      CACHIX_CACHE_NAME: sspeaks-nix
      CACHIX_PUBLIC_KEY: sspeaks-nix.cachix.org-1:Umjs3o8MgvHklkotM8S4XBfTz+zEQCnyr8TFpIC9x+o=
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          use-flakehub: disabled
          use-gha-cache: enabled

      - name: Configure Cachix (read-only substituter)
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ env.CACHIX_CACHE_NAME }}
          skipPush: true

      # Both Pi 4 variants share a runner to reuse the first build's store.
      - name: Build host closures (no activation, no credential)
        run: |
          set -euo pipefail
          : > closures.txt
          paths='{}'
          for host in nixpi nixpi4-bare; do
            path="$(nix build --show-trace --print-build-logs --accept-flake-config \
              --no-link --print-out-paths \
              ".#nixosConfigurations.$host.config.system.build.toplevel")"
            printf '%s\n' "$path" >> closures.txt
            # Only nixpi4-bare is fleet-managed; nixpi is an alternate config.
            case "$host" in
              nixpi4-bare)
                paths="$(jq --arg h "$host" --arg p "$path" '.[$h] = $p' <<< "$paths")" ;;
            esac
          done
          cat closures.txt
          jq -n --arg sha "$GITHUB_SHA" --argjson paths "$paths" \
            '{"headSha": $sha, "paths": $paths}' > host-paths-nixpi4.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: host-paths-nixpi4
          path: host-paths-nixpi4.json
          retention-days: 90

      - name: Publish to Cachix
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          test -s closures.txt

          xargs -a closures.txt cachix push "$CACHIX_CACHE_NAME"

  build-nixpi5:
    name: Build nixpi5 closure
    runs-on: ubuntu-24.04-arm
    env:
      CACHIX_CACHE_NAME: sspeaks-nix
      CACHIX_PUBLIC_KEY: sspeaks-nix.cachix.org-1:Umjs3o8MgvHklkotM8S4XBfTz+zEQCnyr8TFpIC9x+o=
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          use-flakehub: disabled
          use-gha-cache: enabled

      - name: Configure Cachix (read-only substituter)
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ env.CACHIX_CACHE_NAME }}
          skipPush: true

      - name: Build host closure (no activation, no credential)
        run: |
          set -euo pipefail
          path="$(nix build --show-trace --print-build-logs --accept-flake-config \
            --no-link --print-out-paths \
            .#nixosConfigurations.nixpi5.config.system.build.toplevel)"
          printf '%s\n' "$path" > closures.txt
          cat closures.txt
          jq -n --arg sha "$GITHUB_SHA" --arg path "$path" \
            '{"headSha": $sha, "paths": {"nixpi5": $path}}' > host-paths-nixpi5.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: host-paths-nixpi5
          path: host-paths-nixpi5.json
          retention-days: 90

      - name: Publish to Cachix
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          test -s closures.txt

          xargs -a closures.txt cachix push "$CACHIX_CACHE_NAME"

  build-asahi:
    name: Build asahi closure
    runs-on: ubuntu-24.04-arm
    env:
      CACHIX_CACHE_NAME: sspeaks-nix
      CACHIX_PUBLIC_KEY: sspeaks-nix.cachix.org-1:Umjs3o8MgvHklkotM8S4XBfTz+zEQCnyr8TFpIC9x+o=
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          use-flakehub: disabled
          use-gha-cache: enabled

      - name: Configure Cachix (read-only substituter)
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ env.CACHIX_CACHE_NAME }}
          skipPush: true

      - name: Build host closure (no activation, no credential)
        run: |
          set -euo pipefail
          nix build --show-trace --print-build-logs --accept-flake-config \
            --no-link --print-out-paths \
            .#nixosConfigurations.asahi.config.system.build.toplevel \
            > closures.txt
          cat closures.txt

      - name: Publish to Cachix
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          test -s closures.txt

          xargs -a closures.txt cachix push "$CACHIX_CACHE_NAME"

  build-images:
    name: Build Pi SD image and Arm64 closures
    runs-on: ubuntu-24.04-arm
    env:
      CACHIX_CACHE_NAME: sspeaks-nix
      CACHIX_PUBLIC_KEY: sspeaks-nix.cachix.org-1:Umjs3o8MgvHklkotM8S4XBfTz+zEQCnyr8TFpIC9x+o=
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          use-flakehub: disabled
          use-gha-cache: enabled

      - name: Configure Cachix (read-only substituter)
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ env.CACHIX_CACHE_NAME }}
          skipPush: true

      # The SD image needs no VM. Azure VHD creation requires KVM, unavailable
      # on this hosted ARM runner; build that artifact on nixpi5 with enough
      # free disk space instead.
      - name: Build Pi SD image and Arm64 host closures
        run: |
          set -euo pipefail
          : > closures.txt
          nix build --show-trace --print-build-logs --accept-flake-config \
            --no-link --print-out-paths \
            .#packages.aarch64-linux.raspberrytimemachineImage >> closures.txt
          # Capture fleet system closures with explicit per-host path tracking.
          paths='{}'
          for host in proxy raspberrytimemachine; do
            path="$(nix build --show-trace --print-build-logs --accept-flake-config \
              --no-link --print-out-paths \
              ".#nixosConfigurations.$host.config.system.build.toplevel")"
            printf '%s\n' "$path" >> closures.txt
            paths="$(jq --arg h "$host" --arg p "$path" '.[$h] = $p' <<< "$paths")"
          done
          # Cache the system closure too: subsequent updates do not use the image.
          cat closures.txt
          jq -n --arg sha "$GITHUB_SHA" --argjson paths "$paths" \
            '{"headSha": $sha, "paths": $paths}' > host-paths-arm64.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: host-paths-arm64
          path: host-paths-arm64.json
          retention-days: 90

      - name: Inspect and checksum the SD image
        run: |
          set -euo pipefail
          mkdir -p artifacts
          PI_IMAGE="$(sed -n 1p closures.txt)"
          # The output directory also ends in .img.zst; select only files.
          IMAGE_ZST="$(find "$PI_IMAGE" -type f -name '*.img.zst' | head -1)"
          test -s "$IMAGE_ZST"
          # util-linux provides fdisk but has no default executable for nix run.
          nix shell nixpkgs#zstd nixpkgs#util-linux --command bash -c '
            set -euo pipefail
            zstd -t "$0"
            sha256sum "$0" | tee artifacts/raspberrytimemachine-image.sha256
            zstd -dc "$0" > artifacts/rtm.img
            fdisk -l artifacts/rtm.img | tee artifacts/pi-image-fdisk.txt
          ' "$IMAGE_ZST"
          # Pi 4 firmware needs an MBR/DOS layout with a FAT firmware partition.
          grep -qiE 'Disklabel type: dos' artifacts/pi-image-fdisk.txt
          grep -qiE 'FAT' artifacts/pi-image-fdisk.txt
          rm -f artifacts/rtm.img

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: raspberrytimemachine-image-evidence
          path: artifacts/
          retention-days: 30

      - name: Publish to Cachix
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          test -s closures.txt
          xargs -a closures.txt cachix push "$CACHIX_CACHE_NAME"

  collect-paths:
    name: Publish fleet host-path manifest
    # Runs only when all fleet-relevant build jobs succeed.  The artifact
    # produced here is what update-fleet downloads to learn exact store paths
    # without performing local nix evaluation.
    needs: [build-x86-linux, build-nixpi, build-nixpi5, build-images]
    runs-on: ubuntu-latest
    steps:
      - name: Download all host-path fragments
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: host-paths-*
          merge-multiple: true

      - name: Merge path fragments into combined manifest
        run: |
          set -euo pipefail
          jq -se \
            --arg sha "$GITHUB_SHA" \
            'if length != 4 or any(.[]; .headSha != $sha or (.paths | type != "object"))
             then error("invalid fleet path fragments")
             else {"headSha": $sha, "paths": ([.[].paths] | add)}
             end
             | if (.paths | keys) != (["raspberrytimemachine","vidbox","nixpi4-bare","nixpi5","proxy"] | sort)
                  or any(.paths[]; type != "string" or
                    (test("^/nix/store/[a-z0-9]{32}-nixos-system-[A-Za-z0-9._+-]+$") | not))
               then error("invalid fleet host paths")
               else .
               end' \
            host-paths-*.json > fleet-host-paths.json
          cat fleet-host-paths.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fleet-host-paths
          path: fleet-host-paths.json
          retention-days: 90
