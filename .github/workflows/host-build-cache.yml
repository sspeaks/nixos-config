name: Host Build Cache

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-build-cache
  cancel-in-progress: false

# Supply-chain boundary.
#
# A trusted cache writer is root-equivalent: anything holding CACHIX_AUTH_TOKEN
# can publish a signed closure that a target will activate as root. Every build
# step below evaluates Nix code from the repository, so no build step may ever
# see that token.
#
# Therefore CACHIX_AUTH_TOKEN appears exactly once per job, in the `env:` of the
# final "Publish to Cachix" step, and NOTHING runs after that step. The
# cachix-action configure step deliberately passes no authToken -- it only adds
# the public cache as a signature-verified substituter for reads.
#
# Do not reintroduce a job-level `env: CACHIX_AUTH_TOKEN`, and do not add a step
# after a publish step.

jobs:
  build-x86-linux:
    name: Build x86_64 Linux closures
    runs-on: ubuntu-latest
    env:
      CACHIX_CACHE_NAME: sspeaks-nix
      CACHIX_PUBLIC_KEY: sspeaks-nix.cachix.org-1:Umjs3o8MgvHklkotM8S4XBfTz+zEQCnyr8TFpIC9x+o=
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          use-flakehub: disabled
          use-gha-cache: enabled

      # Read-only substituter setup. No authToken: builds must not hold a
      # cache-write credential.
      - name: Configure Cachix (read-only substituter)
        uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
        with:
          name: ${{ env.CACHIX_CACHE_NAME }}
          skipPush: true

      - name: Build host closures (no activation, no credential)
        run: |
          set -euo pipefail
          : > closures.txt
          for host in vidbox; do
            nix build --show-trace --print-build-logs --accept-flake-config \
              --no-link --print-out-paths \
              ".#nixosConfigurations.$host.config.system.build.toplevel" \
              >> closures.txt
          done
          cat closures.txt

      # FINAL STEP. The only place the write token exists. Nothing may follow.
      - name: Publish to Cachix
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          test -s closures.txt

          # Push the project-specific closure. Cachix deliberately does NOT
          # mirror all of nixpkgs: forcing the full closure here would upload
          # gigabytes per host on every commit and is not what a project cache
          # is for. Upstream paths come from cache.nixos.org at fetch time,
          # signature-verified against the official key.
          xargs -a closures.txt cachix push "$CACHIX_CACHE_NAME"


  build-nixpi:
    name: Build nixpi closures
    runs-on: ubuntu-24.04-arm
    env:
      CACHIX_CACHE_NAME: sspeaks-nix
      CACHIX_PUBLIC_KEY: sspeaks-nix.cachix.org-1:Umjs3o8MgvHklkotM8S4XBfTz+zEQCnyr8TFpIC9x+o=
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          use-flakehub: disabled
          use-gha-cache: enabled

      - name: Configure Cachix (read-only substituter)
        uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
        with:
          name: ${{ env.CACHIX_CACHE_NAME }}
          skipPush: true

      # nixpi4-bare is the same Pi 4 hardware/kernel as nixpi, so it reuses the
      # warm store of the first build instead of paying for a second ARM runner.
      - name: Build host closures (no activation, no credential)
        run: |
          set -euo pipefail
          : > closures.txt
          for host in nixpi nixpi4-bare; do
            nix build --show-trace --print-build-logs --accept-flake-config \
              --no-link --print-out-paths \
              ".#nixosConfigurations.$host.config.system.build.toplevel" \
              >> closures.txt
          done
          cat closures.txt

      - name: Publish to Cachix
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          test -s closures.txt

          # Push the project-specific closure. Cachix deliberately does NOT
          # mirror all of nixpkgs: forcing the full closure here would upload
          # gigabytes per host on every commit and is not what a project cache
          # is for. Upstream paths come from cache.nixos.org at fetch time,
          # signature-verified against the official key.
          xargs -a closures.txt cachix push "$CACHIX_CACHE_NAME"

  build-nixpi5:
    name: Build nixpi5 closure
    runs-on: ubuntu-24.04-arm
    env:
      CACHIX_CACHE_NAME: sspeaks-nix
      CACHIX_PUBLIC_KEY: sspeaks-nix.cachix.org-1:Umjs3o8MgvHklkotM8S4XBfTz+zEQCnyr8TFpIC9x+o=
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          use-flakehub: disabled
          use-gha-cache: enabled

      - name: Configure Cachix (read-only substituter)
        uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
        with:
          name: ${{ env.CACHIX_CACHE_NAME }}
          skipPush: true

      - name: Build host closure (no activation, no credential)
        run: |
          set -euo pipefail
          nix build --show-trace --print-build-logs --accept-flake-config \
            --no-link --print-out-paths \
            .#nixosConfigurations.nixpi5.config.system.build.toplevel \
            > closures.txt
          cat closures.txt

      - name: Publish to Cachix
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          test -s closures.txt

          # Push the project-specific closure. Cachix deliberately does NOT
          # mirror all of nixpkgs: forcing the full closure here would upload
          # gigabytes per host on every commit and is not what a project cache
          # is for. Upstream paths come from cache.nixos.org at fetch time,
          # signature-verified against the official key.
          xargs -a closures.txt cachix push "$CACHIX_CACHE_NAME"

  build-asahi:
    name: Build asahi closure
    runs-on: ubuntu-24.04-arm
    env:
      CACHIX_CACHE_NAME: sspeaks-nix
      CACHIX_PUBLIC_KEY: sspeaks-nix.cachix.org-1:Umjs3o8MgvHklkotM8S4XBfTz+zEQCnyr8TFpIC9x+o=
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          use-flakehub: disabled
          use-gha-cache: enabled

      - name: Configure Cachix (read-only substituter)
        uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
        with:
          name: ${{ env.CACHIX_CACHE_NAME }}
          skipPush: true

      - name: Build host closure (no activation, no credential)
        run: |
          set -euo pipefail
          nix build --show-trace --print-build-logs --accept-flake-config \
            --no-link --print-out-paths \
            .#nixosConfigurations.asahi.config.system.build.toplevel \
            > closures.txt
          cat closures.txt

      - name: Publish to Cachix
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          test -s closures.txt

          # Push the project-specific closure. Cachix deliberately does NOT
          # mirror all of nixpkgs: forcing the full closure here would upload
          # gigabytes per host on every commit and is not what a project cache
          # is for. Upstream paths come from cache.nixos.org at fetch time,
          # signature-verified against the official key.
          xargs -a closures.txt cachix push "$CACHIX_CACHE_NAME"

  build-images:
    name: Build Pi SD image and Arm64 closures
    runs-on: ubuntu-24.04-arm
    env:
      CACHIX_CACHE_NAME: sspeaks-nix
      CACHIX_PUBLIC_KEY: sspeaks-nix.cachix.org-1:Umjs3o8MgvHklkotM8S4XBfTz+zEQCnyr8TFpIC9x+o=
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          use-flakehub: disabled
          use-gha-cache: enabled

      - name: Configure Cachix (read-only substituter)
        uses: cachix/cachix-action@ad2ddac53f961de1989924296a1f236fcfbaa4fc # v15
        with:
          name: ${{ env.CACHIX_CACHE_NAME }}
          skipPush: true

      # A toplevel closure is neither an Azure VHD nor a bootable SD card.
      # Build, inspect and checksum the Pi image here; the Azure VHD is
      # deliberately NOT built here.
      #
      # `make-disk-image.nix` runs inside a VM and requires the `kvm` system
      # feature. GitHub-hosted ubuntu-24.04-arm runners have no /dev/kvm
      # (verified 2026-09-02: "ls: cannot access '/dev/kvm'"), so the VHD
      # cannot be produced on this runner at all -- advertising the feature
      # only moves the failure later.
      #
      # Build the VHD on nixpi5 instead: it is real aarch64 hardware WITH
      # /dev/kvm. Check available disk space before starting. This keeps image
      # production independent of both hosted-runner KVM support and the
      # retired Azure ARM build VM.
      #
      # Everything below needs no VM and is genuinely faster here.
      - name: Build Pi SD image and proxy closure
        run: |
          set -euo pipefail
          : > closures.txt
          nix build --show-trace --print-build-logs --accept-flake-config \
            --no-link --print-out-paths \
            .#packages.aarch64-linux.raspberrytimemachineImage >> closures.txt
          nix build --show-trace --print-build-logs --accept-flake-config \
            --no-link --print-out-paths \
            .#nixosConfigurations.proxy.config.system.build.toplevel >> closures.txt
          cat closures.txt

      - name: Inspect and checksum the SD image
        run: |
          set -euo pipefail
          mkdir -p artifacts
          PI_IMAGE="$(sed -n 1p closures.txt)"
          # -type f matters: the Nix output PATH is itself a directory named
          # "...img.zst", containing sd-image/...img.zst. Without -type f,
          # find returns the directory and zstd fails with
          # "is a directory -- ignored".
          IMAGE_ZST="$(find "$PI_IMAGE" -type f -name '*.img.zst' | head -1)"
          test -s "$IMAGE_ZST"
          # `nix shell`, not `nix run`: `nix run nixpkgs#util-linux` tries to
          # exec a binary literally named "util-linux", which does not exist --
          # the package provides fdisk, lsblk and friends.
          nix shell nixpkgs#zstd nixpkgs#util-linux --command bash -c '
            set -euo pipefail
            zstd -t "$0"
            sha256sum "$0" | tee artifacts/raspberrytimemachine-image.sha256
            zstd -dc "$0" > artifacts/rtm.img
            fdisk -l artifacts/rtm.img | tee artifacts/pi-image-fdisk.txt
          ' "$IMAGE_ZST"
          # A Pi image must be MBR/DOS with a FAT firmware partition; a GPT
          # layout here would not boot on a Pi 4 at all.
          grep -qiE 'Disklabel type: dos' artifacts/pi-image-fdisk.txt
          grep -qiE 'FAT' artifacts/pi-image-fdisk.txt
          rm -f artifacts/rtm.img

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: raspberrytimemachine-image-evidence
          path: artifacts/
          retention-days: 30

      - name: Publish to Cachix
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          test -s closures.txt
          xargs -a closures.txt cachix push "$CACHIX_CACHE_NAME"
